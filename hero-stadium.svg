<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020a1a"/>
      <stop offset=".45" stop-color="#05214a"/>
      <stop offset=".78" stop-color="#041a3a"/>
      <stop offset="1" stop-color="#020d20"/>
    </linearGradient>
    <linearGradient id="tier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3a78" stop-opacity=".9"/>
      <stop offset="1" stop-color="#031534" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="halo" r=".5">
      <stop offset="0" stop-color="#e9f5ff" stop-opacity=".9"/>
      <stop offset=".18" stop-color="#7cc4ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#1e7fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1e7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="field" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#2a8cff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#1360d0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1360d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe2ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#bfe2ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="crowd" width="22" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.6" fill="#7fb6ff" opacity=".22"/>
      <circle cx="11" cy="9" r="1.4" fill="#a9d2ff" opacity=".16"/>
      <circle cx="18" cy="3" r="1.3" fill="#5f9cf0" opacity=".2"/>
      <circle cx="15" cy="12" r="1.1" fill="#cfe6ff" opacity=".1"/>
    </pattern>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="bank">
      <circle cx="0" cy="0" r="7"/><circle cx="22" cy="-3" r="7"/><circle cx="44" cy="-6" r="7"/><circle cx="66" cy="-9" r="7"/>
      <circle cx="2" cy="20" r="6.500"/><circle cx="24" cy="17" r="6.500"/><circle cx="46" cy="14" r="6.500"/><circle cx="68" cy="11" r="6.500"/>
      <circle cx="4" cy="40" r="6"/><circle cx="26" cy="37" r="6"/><circle cx="48" cy="34" r="6"/><circle cx="70" cy="31" r="6"/>
    </g>
  </defs>
  <rect width="1920" height="760" fill="url(#sky)"/>
  <!-- light beams -->
  <g fill="url(#beam)">
    <path d="M60 140 0 760h420z"/>
    <path d="M1150 230 820 760h620z" opacity=".7"/>
    <path d="M1800 160 1460 760h460z"/>
  </g>
  <!-- stands: upper and lower tiers sweeping round the bowl -->
  <g filter="url(#soft)">
    <path d="M0 250C420 205 760 255 960 300s560 30 960-60v200C1500 520 1200 480 960 470S420 420 0 470z" fill="url(#tier)"/>
    <path d="M0 250C420 205 760 255 960 300s560 30 960-60v200C1500 520 1200 480 960 470S420 420 0 470z" fill="url(#crowd)"/>
    <path d="M0 470c420-50 720 0 960 0s540 50 960-30v130c-420 80-700 70-960 70S400 560 0 600z" fill="#062a5c" opacity=".85"/>
    <path d="M0 470c420-50 720 0 960 0s540 50 960-30v130c-420 80-700 70-960 70S400 560 0 600z" fill="url(#crowd)" opacity=".8"/>
  </g>
  <g stroke="#4ea8ff" stroke-opacity=".28" stroke-width="2" fill="none">
    <path d="M0 470C420 420 720 470 960 470s540 50 960-30"/>
    <path d="M0 600c400-40 700-30 960-30s540 10 960-80" stroke-opacity=".18"/>
  </g>
  <!-- field glow -->
  <rect y="430" width="1920" height="330" fill="url(#field)"/>
  <!-- floodlight banks -->
  <g fill="url(#halo)">
    <circle cx="70" cy="150" r="190"/><circle cx="1810" cy="170" r="190"/>
  </g>
  <g fill="#f4faff">
    <use href="#bank" transform="translate(16 120)"/>
    <use href="#bank" transform="translate(1756 144)"/>
  </g>
  <g fill="#cfe9ff" filter="url(#blur8)" opacity=".7">
    <use href="#bank" transform="translate(16 120)"/>
    <use href="#bank" transform="translate(1756 144)"/>
  </g>
  <!-- vignette -->
  <rect width="1920" height="760" fill="#010714" opacity=".18"/>
</svg>
