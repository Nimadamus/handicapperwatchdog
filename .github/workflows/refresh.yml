name: Build and deploy
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore profile cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: profiles-${{ github.run_id }}
          restore-keys: profiles-
      - name: Install build dependencies
        run: pip install --quiet cryptography
      - name: Build
        run: python build.py
        env:
          HWD_MASK_KEY: ${{ secrets.HWD_MASK_KEY }}
          HWD_PRO_KEY: ${{ secrets.HWD_PRO_KEY }}
          HWD_EXPORT_TOKEN: ${{ secrets.HWD_EXPORT_TOKEN }}
      - name: Integrity and privacy audit (a privacy leak blocks the deploy)
        run: python tools/audit_profiles.py --live
        env:
          HWD_MASK_KEY: ${{ secrets.HWD_MASK_KEY }}
      - name: Save profile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: profiles-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages sat in syncing_files past the 10 minute default on 7 Nov 2026 (5 timed out deploys); allow 30 minutes.
          timeout: 1800000
  alerts:
    # Opt-in pick alerts for Pro members, sent after the new pending feed is live. Never blocks the site.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send pick alerts
        env:
          T: ${{ secrets.HWD_ALERTS_TOKEN }}
        run: |
          [ -z "$T" ] && { echo "no alerts token"; exit 0; }
          sleep 60
          curl -sS -m 120 -X POST -H "x-alerts-token: $T" https://api.handicapperwatchdog.com/api/alerts/run || true
